name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Lint e build do frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Node (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      # O valor é só de exemplo para o build; a URL real da API vai nas variáveis da Vercel, não aqui.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
